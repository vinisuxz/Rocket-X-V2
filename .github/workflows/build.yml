
#include <stdint.h>
#include <stdbool.h>

#include "xsdk/gpu.h"
#include "xsdk/kernel.h"
#include "xsdk/log.h"
#include "xsdk/present.h"

#define BUFFERS 2
#define SWAP_INTERVAL 1
#define CLEAR_COLOR 0xFF87CEEB
#define BEGIN_TIMEOUT_MS 5000

int main(void)
{
    xsdk_log_write("ROCKET-X: START");

    NTSTATUS status = xsdk_gpu_open();

    if (!NT_SUCCESS(status)) {
        xsdk_log_write("ROCKET-X: GPU OPEN FAILED: 0x%08X",
                       (unsigned)status);
        return 1;
    }

    uint32_t width = 0;
    uint32_t height = 0;

    status = xsdk_present_open(
        XSDK_DISPLAY_720P,
        BUFFERS,
        SWAP_INTERVAL,
        &width,
        &height
    );

    if (!NT_SUCCESS(status)) {
        xsdk_log_write("ROCKET-X: PRESENT OPEN FAILED: 0x%08X",
                       (unsigned)status);
        xsdk_gpu_close();
        return 1;
    }

    xsdk_log_write("ROCKET-X: DISPLAY %ux%u",
                   (unsigned)width,
                   (unsigned)height);

    bool running = true;

    while (running) {
        INPUT_STATE input = {0};

        if (XamInputGetState(0, 0, &input) == ERROR_SUCCESS) {
            if (input.gamepad.buttons & INPUT_GAMEPAD_BACK) {
                running = false;
            }
        }

        if (!running)
            break;

        uint32_t address = 0;

        status = xsdk_present_begin(
            &address,
            BEGIN_TIMEOUT_MS
        );

        if (!NT_SUCCESS(status)) {
            xsdk_log_write("ROCKET-X: PRESENT BEGIN FAILED");
            break;
        }

        xsdk_gpu_set_target(width, height);

        xsdk_gpu_resolve(
            address,
            width,
            height,
            CLEAR_COLOR
        );

        xsdk_present_end();
    }

    xsdk_present_close();
    xsdk_gpu_close();

    xsdk_log_write("ROCKET-X: EXIT");

    return 0;
}
